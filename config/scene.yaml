# Mo ta workcell. Moi toa do tinh trong he base_link cua robot, don vi met.
# Robot dat tren san (base_link o z = 0), ban thao tac cao 0.15 m dat phia truoc.
# CAC SO O DAY PHAI KHOP VOI worlds/ur3_workcell.sdf.

khung_quy_chieu: base_link
link_cong_tac: tool0

ban_thao_tac:
  # Trong MoveIt chi mo ta mat ban bang mot tam mong, khong dung nguyen khoi
  # ban: khoi day cao 0.15 m se trum len ca de robot (de nam o x = 0, cao
  # 0.15 m) va lam moi tu the deu bi coi la va cham.
  tam: [0.40, 0.0, 0.145]
  kich_thuoc: [0.48, 0.70, 0.012]
  cao_mat_ban: 0.15

vat_the:
  canh: 0.045
  vi_tri_ban_dau:
    red_cube:    [0.36, -0.15, 0.1725]
    yellow_cube: [0.36, 0.0, 0.1725]
    blue_cube:   [0.36, 0.15, 0.1725]

vung_dat:
  canh: 0.10
  tam:
    zone_a: [0.26, -0.15, 0.15]
    zone_b: [0.26, 0.0, 0.15]
    zone_c: [0.26, 0.15, 0.15]

chuyen_dong:
  # Huong tool0 khi gap: truc z cua tool chia thang xuong mat ban.
  quaternion_gap: [0.0, 1.0, 0.0, 0.0]     # (x, y, z, w)
  cao_tiep_can: 0.10        # treo tren vat truoc khi ha xuong gap
  cao_di_chuyen: 0.12       # do cao an toan khi mang vat di ngang
  khe_ho_gap: 0.005         # tool0 dung cach mat tren cua khoi mot chut
  buoc_cartesian: 0.005
  ty_le_cartesian_toi_thieu: 0.85
  he_so_van_toc: 0.12
  he_so_gia_toc: 0.12
  tu_the_home: [0.0, -1.5708, 1.2217, -1.2217, -1.5708, 0.0]
  # Tu the trung chuyen: tay may vuon len cao giua ban, dung lam buoc dem khi
  # khong lap duoc ke hoach di thang tu diem nay sang diem kia.
  tu_the_trung_chuyen: [0.0, -1.5708, 1.2217, -1.2217, -1.5708, 0.0]
